services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: network-mapper-api
    environment:
      # Persist the SQLite DB outside the container so data survives rebuilds.
      DATABASE_URL: sqlite:////data/network_mapper.db
      # Override in production (e.g. via an .env file or secrets manager).
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      RENDER_CACHE_MAX_BYTES: ${RENDER_CACHE_MAX_BYTES:-134217728}
      EXPORT_RATE_LIMIT: ${EXPORT_RATE_LIMIT:-30}
    volumes:
      - app-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: network-mapper-web
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  app-data:
