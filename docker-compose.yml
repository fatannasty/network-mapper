services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: network-mapper-api
    environment:
      # Persist the SQLite DB outside the container so data survives rebuilds.
      DATABASE_URL: sqlite:////data/network_mapper.db
      # Override in production (e.g. via an .env file or secrets manager).
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      RENDER_CACHE_MAX_BYTES: ${RENDER_CACHE_MAX_BYTES:-134217728}
      EXPORT_RATE_LIMIT: ${EXPORT_RATE_LIMIT:-30}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      # Reachability poll interval (seconds) feeding up/down/flapping state.
      LATENCY_POLL_INTERVAL: ${LATENCY_POLL_INTERVAL:-60}
      # Interface utilization sampling (seconds; 0 disables).
      UTIL_POLL_INTERVAL: ${UTIL_POLL_INTERVAL:-300}
      UTIL_POLL_BATCH: ${UTIL_POLL_BATCH:-100}
      # Health alerts (seconds between checks; 0 disables).
      ALERT_CHECK_INTERVAL: ${ALERT_CHECK_INTERVAL:-300}
      ALERT_COOLDOWN_HOURS: ${ALERT_COOLDOWN_HOURS:-6}
      # Scheduled config backups (seconds; 0 disables, 86400 = nightly).
      CONFIG_COLLECT_INTERVAL: ${CONFIG_COLLECT_INTERVAL:-0}
      CONFIG_COLLECT_BATCH: ${CONFIG_COLLECT_BATCH:-50}
      # Health-score history snapshots (seconds; 0 disables, default hourly).
      HEALTH_HISTORY_INTERVAL: ${HEALTH_HISTORY_INTERVAL:-3600}
      # Scheduled executive reports: hourly | daily | weekly | off.
      EXEC_REPORT_SCHEDULE: ${EXEC_REPORT_SCHEDULE:-off}
      # Email delivery (optional — used by exec reports and alerts).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      REPORT_TO: ${REPORT_TO:-}
    volumes:
      - app-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: network-mapper-web
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  app-data: