<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Cisco Server Icon - 3U Rack -->
  <!-- Unit 1 -->
  <rect x="20" y="12" width="80" height="24" rx="3" fill="#1a1a2e" stroke="#8b5cf6" stroke-width="2.5"/>
  <circle cx="30" cy="24" r="3" fill="#8b5cf6"/>
  <circle cx="40" cy="24" r="3" fill="#22c55e"/>
  <rect x="50" y="20" width="36" height="2" rx="1" fill="#a78bfa" opacity="0.6"/>
  <rect x="50" y="26" width="24" height="2" rx="1" fill="#a78bfa" opacity="0.4"/>
  <text x="92" y="27" font-family="Arial" font-size="6" fill="#8b5cf6" text-anchor="end">U1</text>
  <!-- Unit 2 -->
  <rect x="20" y="40" width="80" height="24" rx="3" fill="#1a1a2e" stroke="#8b5cf6" stroke-width="2.5"/>
  <circle cx="30" cy="52" r="3" fill="#8b5cf6"/>
  <circle cx="40" cy="52" r="3" fill="#22c55e"/>
  <rect x="50" y="48" width="36" height="2" rx="1" fill="#a78bfa" opacity="0.6"/>
  <rect x="50" y="54" width="24" height="2" rx="1" fill="#a78bfa" opacity="0.4"/>
  <text x="92" y="55" font-family="Arial" font-size="6" fill="#8b5cf6" text-anchor="end">U2</text>
  <!-- Unit 3 -->
  <rect x="20" y="68" width="80" height="24" rx="3" fill="#1a1a2e" stroke="#8b5cf6" stroke-width="2.5"/>
  <circle cx="30" cy="80" r="3" fill="#8b5cf6"/>
  <circle cx="40" cy="80" r="3" fill="#22c55e"/>
  <rect x="50" y="76" width="36" height="2" rx="1" fill="#a78bfa" opacity="0.6"/>
  <rect x="50" y="82" width="24" height="2" rx="1" fill="#a78bfa" opacity="0.4"/>
  <text x="92" y="83" font-family="Arial" font-size="6" fill="#8b5cf6" text-anchor="end">U3</text>
  <!-- Network ports -->
  <rect x="24" y="96" width="10" height="8" rx="1" fill="#0ea5e9"/>
  <rect x="38" y="96" width="10" height="8" rx="1" fill="#0ea5e9"/>
  <text x="29" y="102" font-family="Arial" font-size="5" fill="#fff" text-anchor="middle">ETH</text>
  <text x="43" y="102" font-family="Arial" font-size="5" fill="#fff" text-anchor="middle">ETH</text>
  <!-- Label -->
  <text x="80" y="104" font-family="Arial" font-size="7" fill="#8b5cf6" text-anchor="middle" font-weight="bold">SERVER</text>
</svg>
