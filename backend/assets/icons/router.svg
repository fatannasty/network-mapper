<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Cisco Router Icon - Circle with directional arrows -->
  <circle cx="60" cy="60" r="54" fill="#1a1a2e" stroke="#3b82f6" stroke-width="3"/>
  <circle cx="60" cy="60" r="36" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4,3"/>
  <!-- Cross lines -->
  <line x1="36" y1="60" x2="84" y2="60" stroke="#60a5fa" stroke-width="2"/>
  <line x1="60" y1="36" x2="60" y2="84" stroke="#60a5fa" stroke-width="2"/>
  <!-- Arrows -->
  <polygon points="28,60 36,56 36,64" fill="#60a5fa"/>
  <polygon points="92,60 84,56 84,64" fill="#60a5fa"/>
  <polygon points="60,28 56,36 64,36" fill="#60a5fa"/>
  <polygon points="60,92 56,84 64,84" fill="#60a5fa"/>
  <!-- Center dot -->
  <circle cx="60" cy="60" r="6" fill="#3b82f6"/>
  <circle cx="60" cy="60" r="3" fill="#fff"/>
</svg>
