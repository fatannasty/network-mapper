<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Cisco Meraki MR56 - High-density Indoor AP -->
  <!-- Body - larger form factor -->
  <rect x="14" y="26" width="72" height="48" rx="12" fill="#1a1a2e" stroke="#f59e0b" stroke-width="2.5"/>
  <!-- Meraki logo -->
  <circle cx="50" cy="50" r="16" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="50" y="54" font-family="Arial" font-size="9" fill="#fbbf24" text-anchor="middle" font-weight="bold">M</text>
  <!-- WiFi 6E indicator -->
  <text x="50" y="40" font-family="Arial" font-size="5" fill="#fbbf24" text-anchor="middle">WiFi 6E</text>
  <!-- Status -->
  <circle cx="50" cy="68" r="2" fill="#22c55e"/>
  <!-- Antenna lines - 4x4 MIMO -->
  <line x1="22" y1="26" x2="22" y2="12" stroke="#f59e0b" stroke-width="2"/>
  <line x1="38" y1="26" x2="38" y2="10" stroke="#f59e0b" stroke-width="2"/>
  <line x1="62" y1="26" x2="62" y2="10" stroke="#f59e0b" stroke-width="2"/>
  <line x1="78" y1="26" x2="78" y2="12" stroke="#f59e0b" stroke-width="2"/>
  <!-- Signal waves -->
  <path d="M14,8 Q50,-8 86,8" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.5"/>
  <path d="M22,4 Q50,-6 78,4" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.3"/>
  <text x="50" y="90" font-family="Arial" font-size="7" fill="#f59e0b" text-anchor="middle" font-weight="bold">MR56</text>
</svg>
