<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <!-- Cisco Catalyst 9200 Series - High Quality -->
  <defs>
    <linearGradient id="body9200" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a3e"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="port9200" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#38d9a9"/>
      <stop offset="100%" style="stop-color:#20c997"/>
    </linearGradient>
  </defs>
  <!-- Main body -->
  <rect x="5" y="15" width="190" height="60" rx="4" fill="url(#body9200)" stroke="#20c997" stroke-width="2"/>
  <!-- Ventilation grille top -->
  <line x1="10" y1="20" x2="190" y2="20" stroke="#333350" stroke-width="0.5"/>
  <!-- Port row 1 -->
  <g transform="translate(12, 24)">
    <rect width="10" height="8" rx="1" fill="url(#port9200)" opacity="0.85"/>
    <rect x="14" width="10" height="8" rx="1" fill="url(#port9200)" opacity="0.85"/>
    <rect x="28" width="10" height="8" rx="1" fill="url(#port9200)" opacity="0.85"/>
    <rect x="42" width="10" height="8" rx="1" fill="url(#port9200)" opacity="0.85"/>
    <rect x="56" width="10" height="8" rx="1" fill="url(#port9200)" opacity="0.85"/>
    <rect x="70" width="10" height="8" rx="1" fill="url(#port9200)" opacity="0.85"/>
    <rect x="84" width="10" height="8" rx="1" fill="url(#port9200)" opacity="0.85"/>
    <rect x="98" width="10" height="8" rx="1" fill="url(#port9200)" opacity="0.85"/>
    <rect x="112" width="10" height="8" rx="1" fill="url(#port9200)" opacity="0.85"/>
    <rect x="126" width="10" height="8" rx="1" fill="url(#port9200)" opacity="0.85"/>
    <rect x="140" width="10" height="8" rx="1" fill="#0ea5e9"/>
    <rect x="154" width="10" height="8" rx="1" fill="#0ea5e9"/>
  </g>
  <!-- Port row 2 -->
  <g transform="translate(12, 36)">
    <rect width="10" height="8" rx="1" fill="url(#port9200)" opacity="0.85"/>
    <rect x="14" width="10" height="8" rx="1" fill="url(#port9200)" opacity="0.85"/>
    <rect x="28" width="10" height="8" rx="1" fill="url(#port9200)" opacity="0.85"/>
    <rect x="42" width="10" height="8" rx="1" fill="url(#port9200)" opacity="0.85"/>
    <rect x="56" width="10" height="8" rx="1" fill="url(#port9200)" opacity="0.85"/>
    <rect x="70" width="10" height="8" rx="1" fill="url(#port9200)" opacity="0.85"/>
    <rect x="84" width="10" height="8" rx="1" fill="url(#port9200)" opacity="0.85"/>
    <rect x="98" width="10" height="8" rx="1" fill="url(#port9200)" opacity="0.85"/>
    <rect x="112" width="10" height="8" rx="1" fill="url(#port9200)" opacity="0.85"/>
    <rect x="126" width="10" height="8" rx="1" fill="url(#port9200)" opacity="0.85"/>
    <rect x="140" width="10" height="8" rx="1" fill="#0ea5e9"/>
    <rect x="154" width="10" height="8" rx="1" fill="#0ea5e9"/>
  </g>
  <!-- Divider -->
  <line x1="10" y1="50" x2="190" y2="50" stroke="#20c997" stroke-width="0.5" opacity="0.4"/>
  <!-- Status LEDs -->
  <circle cx="18" cy="58" r="3" fill="#22c55e"/>
  <circle cx="28" cy="58" r="3" fill="#22c55e"/>
  <circle cx="38" cy="58" r="3" fill="#f59e0b"/>
  <!-- Model text -->
  <text x="100" y="60" font-family="Arial, sans-serif" font-size="9" fill="#20c997" text-anchor="middle" font-weight="bold">C9200-24P</text>
  <!-- Cisco logo area -->
  <text x="170" y="60" font-family="Arial, sans-serif" font-size="7" fill="#475569" text-anchor="middle">CISCO</text>
  <!-- Bottom label -->
  <text x="100" y="100" font-family="Arial, sans-serif" font-size="12" fill="#20c997" text-anchor="middle" font-weight="bold">Catalyst 9200 Series</text>
  <text x="100" y="114" font-family="Arial, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">24-Port PoE+ Switch</text>
</svg>
