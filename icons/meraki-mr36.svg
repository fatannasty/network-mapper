<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Cisco Meraki MR36 - Indoor AP -->
  <!-- Body -->
  <rect x="20" y="30" width="60" height="40" rx="8" fill="#1a1a2e" stroke="#06b6d4" stroke-width="2.5"/>
  <!-- Meraki logo area -->
  <circle cx="50" cy="50" r="12" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="50" y="53" font-family="Arial" font-size="7" fill="#22d3ee" text-anchor="middle" font-weight="bold">M</text>
  <!-- Status LED -->
  <circle cx="50" cy="64" r="2" fill="#22c55e"/>
  <!-- Antenna hints -->
  <line x1="30" y1="30" x2="30" y2="20" stroke="#06b6d4" stroke-width="2"/>
  <line x1="70" y1="30" x2="70" y2="20" stroke="#06b6d4" stroke-width="2"/>
  <!-- Label -->
  <text x="50" y="86" font-family="Arial" font-size="7" fill="#06b6d4" text-anchor="middle" font-weight="bold">MR36</text>
</svg>
