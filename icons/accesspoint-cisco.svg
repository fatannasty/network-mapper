<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Cisco Wireless Access Point Icon -->
  <!-- Base/mount -->
  <rect x="40" y="80" width="40" height="12" rx="3" fill="#1a1a2e" stroke="#f59e0b" stroke-width="2"/>
  <!-- Antenna pole -->
  <line x1="60" y1="80" x2="60" y2="40" stroke="#d97706" stroke-width="3"/>
  <!-- AP body -->
  <circle cx="60" cy="36" r="14" fill="#1a1a2e" stroke="#f59e0b" stroke-width="2.5"/>
  <circle cx="60" cy="36" r="6" fill="#f59e0b"/>
  <circle cx="60" cy="36" r="3" fill="#1a1a2e"/>
  <!-- Signal waves -->
  <path d="M30,20 Q60,0 90,20" fill="none" stroke="#fbbf24" stroke-width="2.5" opacity="0.9"/>
  <path d="M36,28 Q60,12 84,28" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.7"/>
  <path d="M42,36 Q60,24 78,36" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.5"/>
  <!-- Status LED -->
  <circle cx="60" cy="50" r="2" fill="#22c55e"/>
  <!-- Label -->
  <text x="60" y="104" font-family="Arial" font-size="7" fill="#f59e0b" text-anchor="middle" font-weight="bold">AIR-CAP</text>
</svg>
