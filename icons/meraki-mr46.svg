<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Cisco Meraki MR46 - Indoor AP (WiFi 6) -->
  <!-- Body -->
  <rect x="18" y="28" width="64" height="44" rx="10" fill="#1a1a2e" stroke="#3b82f6" stroke-width="2.5"/>
  <!-- Meraki logo -->
  <circle cx="50" cy="50" r="14" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="50" y="54" font-family="Arial" font-size="8" fill="#60a5fa" text-anchor="middle" font-weight="bold">M</text>
  <!-- WiFi 6 indicator -->
  <text x="50" y="42" font-family="Arial" font-size="5" fill="#60a5fa" text-anchor="middle">WiFi 6</text>
  <!-- Status -->
  <circle cx="50" cy="66" r="2" fill="#22c55e"/>
  <!-- Antenna lines -->
  <line x1="28" y1="28" x2="28" y2="16" stroke="#3b82f6" stroke-width="2"/>
  <line x1="50" y1="28" x2="50" y2="14" stroke="#3b82f6" stroke-width="2"/>
  <line x1="72" y1="28" x2="72" y2="16" stroke="#3b82f6" stroke-width="2"/>
  <!-- Signal waves -->
  <path d="M20,12 Q50,-4 80,12" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.6"/>
  <text x="50" y="88" font-family="Arial" font-size="7" fill="#3b82f6" text-anchor="middle" font-weight="bold">MR46</text>
</svg>
