<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <!-- Cisco Meraki MR46 WiFi 6 AP - High Quality -->
  <defs>
    <linearGradient id="bodyMR46" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a3e"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <radialGradient id="glowMR46" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <!-- Glow effect -->
  <circle cx="70" cy="65" r="55" fill="url(#glowMR46)"/>
  <!-- Main body -->
  <rect x="20" y="35" width="100" height="60" rx="16" fill="url(#bodyMR46)" stroke="#3b82f6" stroke-width="2.5"/>
  <!-- Meraki M logo -->
  <circle cx="70" cy="65" r="20" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="70" y="72" font-family="Arial, sans-serif" font-size="18" fill="#60a5fa" text-anchor="middle" font-weight="bold">M</text>
  <!-- WiFi 6 badge -->
  <rect x="52" y="44" width="36" height="10" rx="5" fill="#3b82f6"/>
  <text x="70" y="52" font-family="Arial, sans-serif" font-size="7" fill="#fff" text-anchor="middle" font-weight="bold">WiFi 6</text>
  <!-- Status LED -->
  <circle cx="70" cy="88" r="3" fill="#22c55e"/>
  <!-- Antenna lines -->
  <line x1="40" y1="35" x2="40" y2="18" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="70" y1="35" x2="70" y2="14" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="100" y1="35" x2="100" y2="18" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Signal waves -->
  <path d="M25,12 Q70,-8 115,12" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.6"/>
  <path d="M35,6 Q70,-4 105,6" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.4"/>
  <!-- Bottom label -->
  <text x="70" y="118" font-family="Arial, sans-serif" font-size="11" fill="#3b82f6" text-anchor="middle" font-weight="bold">Meraki MR46</text>
  <text x="70" y="132" font-family="Arial, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Indoor WiFi 6 Access Point</text>
</svg>
