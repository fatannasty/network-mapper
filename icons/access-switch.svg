  <rect x="54" y="34" width="8" height="10" rx="1" fill="#22d3ee" opacity="0.8"/>
  <rect x="64" y="34" width="8" height="10" rx="1" fill="#22d3ee" opacity="0.8"/>
  <rect x="74" y="34" width="8" height="10" rx="1" fill="#22d3ee" opacity="0.8"/>
  <rect x="84" y="34" width="8" height="10" rx="1" fill="#22d3ee" opacity="0.8"/>
  <rect x="94" y="34" width="8" height="10" rx="1" fill="#0ea5e9"/>
  <rect x="104" y="34" width="4" height="10" rx="1" fill="#0ea5e9"/>
