  <rect x="54" y="48" width="8" height="10" rx="1" fill="#22d3ee" opacity="0.8"/>
  <rect x="64" y="48" width="8" height="10" rx="1" fill="#22d3ee" opacity="0.8"/>
  <rect x="74" y="48" width="8" height="10" rx="1" fill="#22d3ee" opacity="0.8"/>
  <rect x="84" y="48" width="8" height="10" rx="1" fill="#22d3ee" opacity="0.8"/>
