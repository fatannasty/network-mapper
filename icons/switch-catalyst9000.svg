<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Cisco Catalyst 9000 Switch Icon -->
  <rect x="8" y="24" width="104" height="72" rx="6" fill="#1a1a2e" stroke="#10b981" stroke-width="3"/>
  <!-- Top port row -->
  <rect x="16" y="32" width="10" height="8" rx="1" fill="#34d399" opacity="0.8"/>
  <rect x="30" y="32" width="10" height="8" rx="1" fill="#34d399" opacity="0.8"/>
  <rect x="44" y="32" width="10" height="8" rx="1" fill="#34d399" opacity="0.8"/>
  <rect x="58" y="32" width="10" height="8" rx="1" fill="#34d399" opacity="0.8"/>
  <rect x="72" y="32" width="10" height="8" rx="1" fill="#34d399" opacity="0.8"/>
  <rect x="86" y="32" width="10" height="8" rx="1" fill="#34d399" opacity="0.8"/>
  <rect x="100" y="32" width="6" height="8" rx="1" fill="#34d399" opacity="0.6"/>
  <!-- Bottom port row -->
  <rect x="16" y="44" width="10" height="8" rx="1" fill="#34d399" opacity="0.8"/>
  <rect x="30" y="44" width="10" height="8" rx="1" fill="#34d399" opacity="0.8"/>
  <rect x="44" y="44" width="10" height="8" rx="1" fill="#34d399" opacity="0.8"/>
  <rect x="58" y="44" width="10" height="8" rx="1" fill="#34d399" opacity="0.8"/>
  <rect x="72" y="44" width="10" height="8" rx="1" fill="#34d399" opacity="0.8"/>
  <rect x="86" y="44" width="10" height="8" rx="1" fill="#34d399" opacity="0.8"/>
  <rect x="100" y="44" width="6" height="8" rx="1" fill="#34d399" opacity="0.6"/>
  <!-- Divider line -->
  <line x1="14" y1="58" x2="106" y2="58" stroke="#10b981" stroke-width="1" opacity="0.5"/>
  <!-- Status LEDs -->
  <circle cx="20" cy="68" r="3" fill="#22c55e"/>
  <circle cx="30" cy="68" r="3" fill="#22c55e"/>
  <circle cx="40" cy="68" r="3" fill="#f59e0b"/>
  <!-- Cat 9000 label area -->
  <rect x="50" y="62" width="50" height="12" rx="2" fill="#0f172a"/>
  <text x="75" y="71" font-family="Arial" font-size="7" fill="#10b981" text-anchor="middle" font-weight="bold">CATALYST 9000</text>
  <!-- Uplink ports -->
  <rect x="16" y="80" width="14" height="10" rx="2" fill="#0ea5e9"/>
  <rect x="34" y="80" width="14" height="10" rx="2" fill="#0ea5e9"/>
  <text x="23" y="87" font-family="Arial" font-size="5" fill="#fff" text-anchor="middle">10G</text>
  <text x="41" y="87" font-family="Arial" font-size="5" fill="#fff" text-anchor="middle">10G</text>
  <!-- Ventilation grille -->
  <line x1="60" y1="80" x2="106" y2="80" stroke="#334155" stroke-width="0.5"/>
  <line x1="60" y1="83" x2="106" y2="83" stroke="#334155" stroke-width="0.5"/>
  <line x1="60" y1="86" x2="106" y2="86" stroke="#334155" stroke-width="0.5"/>
  <line x1="60" y1="89" x2="106" y2="89" stroke="#334155" stroke-width="0.5"/>
</svg>
