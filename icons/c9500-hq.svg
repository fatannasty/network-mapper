<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <!-- Cisco Catalyst 9500 Core Switch - High Quality -->
  <defs>
    <linearGradient id="body9500" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a3e"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="port9500" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c084fc"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
  </defs>
  <!-- Main body -->
  <rect x="5" y="8" width="190" height="68" rx="5" fill="url(#body9500)" stroke="#a855f7" stroke-width="2.5"/>
  <!-- Supervisor module -->
  <rect x="10" y="12" width="70" height="24" rx="3" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
  <circle cx="18" cy="24" r="3" fill="#a855f7"/>
  <circle cx="28" cy="24" r="3" fill="#22c55e"/>
  <rect x="40" y="20" width="28" height="3" rx="1" fill="#c084fc" opacity="0.5"/>
  <text x="45" y="32" font-family="Arial, sans-serif" font-size="6" fill="#c084fc">SUP-1</text>
  <!-- Line card row 1 -->
  <rect x="10" y="40" width="180" height="12" rx="2" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
  <g transform="translate(14, 42)">
    <rect width="6" height="8" rx="1" fill="url(#port9500)" opacity="0.7"/>
    <rect x="8" width="6" height="8" rx="1" fill="url(#port9500)" opacity="0.7"/>
    <rect x="16" width="6" height="8" rx="1" fill="url(#port9500)" opacity="0.7"/>
    <rect x="24" width="6" height="8" rx="1" fill="url(#port9500)" opacity="0.7"/>
    <rect x="32" width="6" height="8" rx="1" fill="url(#port9500)" opacity="0.7"/>
    <rect x="40" width="6" height="8" rx="1" fill="url(#port9500)" opacity="0.7"/>
    <rect x="48" width="6" height="8" rx="1" fill="#22c55e" opacity="0.7"/>
    <rect x="56" width="6" height="8" rx="1" fill="#22c55e" opacity="0.7"/>
    <rect x="64" width="6" height="8" rx="1" fill="url(#port9500)" opacity="0.7"/>
    <rect x="72" width="6" height="8" rx="1" fill="url(#port9500)" opacity="0.7"/>
    <rect x="80" width="6" height="8" rx="1" fill="url(#port9500)" opacity="0.7"/>
    <rect x="88" width="6" height="8" rx="1" fill="url(#port9500)" opacity="0.7"/>
    <rect x="96" width="6" height="8" rx="1" fill="url(#port9500)" opacity="0.7"/>
    <rect x="104" width="6" height="8" rx="1" fill="url(#port9500)" opacity="0.7"/>
    <rect x="112" width="6" height="8" rx="1" fill="url(#port9500)" opacity="0.7"/>
    <rect x="120" width="6" height="8" rx="1" fill="url(#port9500)" opacity="0.7"/>
    <rect x="128" width="6" height="8" rx="1" fill="url(#port9500)" opacity="0.7"/>
    <rect x="136" width="6" height="8" rx="1" fill="url(#port9500)" opacity="0.7"/>
    <rect x="144" width="6" height="8" rx="1" fill="url(#port9500)" opacity="0.7"/>
    <rect x="152" width="6" height="8" rx="1" fill="url(#port9500)" opacity="0.7"/>
    <rect x="160" width="6" height="8" rx="1" fill="url(#port9500)" opacity="0.7"/>
  </g>
  <!-- Power supplies -->
  <rect x="10" y="56" width="85" height="14" rx="2" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
  <circle cx="18" cy="63" r="2" fill="#22c55e"/>
  <text x="52" y="65" font-family="Arial, sans-serif" font-size="6" fill="#c084fc" text-anchor="middle">PSU A - 650W</text>
  <rect x="105" y="56" width="85" height="14" rx="2" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
  <circle cx="113" cy="63" r="2" fill="#22c55e"/>
  <text x="147" y="65" font-family="Arial, sans-serif" font-size="6" fill="#c084fc" text-anchor="middle">PSU B - 650W</text>
  <!-- Cisco logo -->
  <text x="60" y="28" font-family="Arial, sans-serif" font-size="6" fill="#475569" text-anchor="middle">CISCO</text>
  <!-- Bottom label -->
  <text x="100" y="96" font-family="Arial, sans-serif" font-size="12" fill="#a855f7" text-anchor="middle" font-weight="bold">Catalyst 9500 Series</text>
  <text x="100" y="110" font-family="Arial, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Core Switch - Modular Chassis</text>
</svg>
