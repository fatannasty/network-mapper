<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Cisco PC/Workstation Icon -->
  <!-- Monitor -->
  <rect x="16" y="12" width="88" height="56" rx="4" fill="#1a1a2e" stroke="#6366f1" stroke-width="2.5"/>
  <rect x="22" y="18" width="76" height="44" rx="2" fill="#0f172a"/>
  <!-- Screen content - terminal -->
  <text x="28" y="32" font-family="monospace" font-size="6" fill="#22c55e">$ network-admin@switch</text>
  <text x="28" y="40" font-family="monospace" font-size="6" fill="#60a5fa">VLAN 10: 192.168.10.0/24</text>
  <text x="28" y="48" font-family="monospace" font-size="6" fill="#f59e0b">Status: Connected</text>
  <rect x="28" y="52" width="16" height="2" rx="1" fill="#22c55e" opacity="0.6"/>
  <!-- Status LED -->
  <circle cx="60" cy="68" r="2" fill="#22c55e"/>
  <!-- Stand -->
  <rect x="46" y="68" width="28" height="4" rx="1" fill="#6366f1"/>
  <line x1="50" y1="72" x2="50" y2="80" stroke="#6366f1" stroke-width="2"/>
  <line x1="70" y1="72" x2="70" y2="80" stroke="#6366f1" stroke-width="2"/>
  <!-- Base -->
  <rect x="36" y="80" width="48" height="4" rx="2" fill="#6366f1"/>
  <!-- Keyboard -->
  <rect x="28" y="88" width="64" height="10" rx="2" fill="#1a1a2e" stroke="#4f46e5" stroke-width="1.5"/>
  <rect x="32" y="90" width="6" height="2" rx="0.5" fill="#4f46e5" opacity="0.5"/>
  <rect x="40" y="90" width="6" height="2" rx="0.5" fill="#4f46e5" opacity="0.5"/>
  <rect x="48" y="90" width="6" height="2" rx="0.5" fill="#4f46e5" opacity="0.5"/>
  <rect x="56" y="90" width="6" height="2" rx="0.5" fill="#4f46e5" opacity="0.5"/>
  <rect x="64" y="90" width="6" height="2" rx="0.5" fill="#4f46e5" opacity="0.5"/>
  <rect x="72" y="90" width="6" height="2" rx="0.5" fill="#4f46e5" opacity="0.5"/>
  <rect x="80" y="90" width="6" height="2" rx="0.5" fill="#4f46e5" opacity="0.5"/>
  <!-- Label -->
  <text x="60" y="110" font-family="Arial" font-size="7" fill="#6366f1" text-anchor="middle" font-weight="bold">WORKSTATION</text>
</svg>
