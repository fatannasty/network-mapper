<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Cisco Cloud/WAN Icon -->
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:0.1"/>
    </linearGradient>
  </defs>
  <!-- Cloud shape -->
  <path d="M30,70 Q10,70 10,52 Q10,36 28,32 Q30,18 48,16 Q64,14 72,28 Q82,20 96,28 Q108,36 104,52 Q104,70 84,72 L30,72 Z" fill="url(#cloudGrad)" stroke="#06b6d4" stroke-width="2.5"/>
  <!-- Internet symbol -->
