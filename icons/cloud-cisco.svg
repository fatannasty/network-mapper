  <circle cx="60" cy="72" r="4" fill="#06b6d4"/>
  <circle cx="60" cy="72" r="2" fill="#fff"/>
  <!-- Label -->
  <text x="60" y="96" font-family="Arial" font-size="7" fill="#06b6d4" text-anchor="middle" font-weight="bold">INTERNET / WAN</text>
</svg>
