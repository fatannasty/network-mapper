  <ellipse cx="60" cy="48" rx="8" ry="16" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.6"/>
  <line x1="44" y1="48" x2="76" y2="48" stroke="#22d3ee" stroke-width="1.5" opacity="0.6"/>
