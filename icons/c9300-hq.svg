<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <!-- Cisco Catalyst 9300 Series - High Quality -->
  <defs>
    <linearGradient id="body9300" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a3e"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="port9300" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fb923c"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
  </defs>
  <!-- Main body -->
  <rect x="5" y="12" width="190" height="64" rx="5" fill="url(#body9300)" stroke="#f97316" stroke-width="2.5"/>
  <!-- Port row 1 -->
  <g transform="translate(10, 18)">
    <rect width="9" height="8" rx="1" fill="url(#port9300)" opacity="0.8"/>
    <rect x="12" width="9" height="8" rx="1" fill="url(#port9300)" opacity="0.8"/>
    <rect x="24" width="9" height="8" rx="1" fill="url(#port9300)" opacity="0.8"/>
    <rect x="36" width="9" height="8" rx="1" fill="url(#port9300)" opacity="0.8"/>
    <rect x="48" width="9" height="8" rx="1" fill="url(#port9300)" opacity="0.8"/>
    <rect x="60" width="9" height="8" rx="1" fill="url(#port9300)" opacity="0.8"/>
    <rect x="72" width="9" height="8" rx="1" fill="url(#port9300)" opacity="0.8"/>
    <rect x="84" width="9" height="8" rx="1" fill="url(#port9300)" opacity="0.8"/>
    <rect x="96" width="9" height="8" rx="1" fill="url(#port9300)" opacity="0.8"/>
    <rect x="108" width="9" height="8" rx="1" fill="url(#port9300)" opacity="0.8"/>
    <rect x="120" width="9" height="8" rx="1" fill="url(#port9300)" opacity="0.8"/>
    <rect x="132" width="9" height="8" rx="1" fill="url(#port9300)" opacity="0.8"/>
    <rect x="144" width="9" height="8" rx="1" fill="url(#port9300)" opacity="0.8"/>
    <rect x="156" width="9" height="8" rx="1" fill="url(#port9300)" opacity="0.8"/>
    <rect x="168" width="9" height="8" rx="1" fill="url(#port9300)" opacity="0.8"/>
  </g>
  <!-- Port row 2 -->
  <g transform="translate(10, 30)">
    <rect width="9" height="8" rx="1" fill="url(#port9300)" opacity="0.8"/>
    <rect x="12" width="9" height="8" rx="1" fill="url(#port9300)" opacity="0.8"/>
    <rect x="24" width="9" height="8" rx="1" fill="url(#port9300)" opacity="0.8"/>
    <rect x="36" width="9" height="8" rx="1" fill="url(#port9300)" opacity="0.8"/>
    <rect x="48" width="9" height="8" rx="1" fill="url(#port9300)" opacity="0.8"/>
    <rect x="60" width="9" height="8" rx="1" fill="url(#port9300)" opacity="0.8"/>
    <rect x="72" width="9" height="8" rx="1" fill="url(#port9300)" opacity="0.8"/>
    <rect x="84" width="9" height="8" rx="1" fill="url(#port9300)" opacity="0.8"/>
    <rect x="96" width="9" height="8" rx="1" fill="url(#port9300)" opacity="0.8"/>
    <rect x="108" width="9" height="8" rx="1" fill="url(#port9300)" opacity="0.8"/>
    <rect x="120" width="9" height="8" rx="1" fill="url(#port9300)" opacity="0.8"/>
    <rect x="132" width="9" height="8" rx="1" fill="url(#port9300)" opacity="0.8"/>
    <rect x="144" width="9" height="8" rx="1" fill="url(#port9300)" opacity="0.8"/>
    <rect x="156" width="9" height="8" rx="1" fill="url(#port9300)" opacity="0.8"/>
    <rect x="168" width="9" height="8" rx="1" fill="url(#port9300)" opacity="0.8"/>
  </g>
  <!-- Divider -->
  <line x1="8" y1="44" x2="192" y2="44" stroke="#f97316" stroke-width="0.5" opacity="0.4"/>
  <!-- Status LEDs -->
  <circle cx="16" cy="52" r="3" fill="#22c55e"/>
  <circle cx="26" cy="52" r="3" fill="#22c55e"/>
  <circle cx="36" cy="52" r="3" fill="#f59e0b"/>
  <!-- Model text -->
  <text x="100" y="54" font-family="Arial, sans-serif" font-size="9" fill="#fb923c" text-anchor="middle" font-weight="bold">C9300-48T</text>
  <!-- Stack ports -->
  <rect x="148" y="50" width="16" height="8" rx="2" fill="#f97316" opacity="0.9"/>
  <rect x="168" y="50" width="16" height="8" rx="2" fill="#f97316" opacity="0.9"/>
  <text x="156" y="56" font-family="Arial, sans-serif" font-size="5" fill="#fff" text-anchor="middle">STACK</text>
  <text x="176" y="56" font-family="Arial, sans-serif" font-size="5" fill="#fff" text-anchor="middle">STACK</text>
  <!-- Cisco logo -->
  <text x="60" y="56" font-family="Arial, sans-serif" font-size="7" fill="#475569" text-anchor="middle">CISCO</text>
  <!-- Bottom label -->
  <text x="100" y="98" font-family="Arial, sans-serif" font-size="12" fill="#f97316" text-anchor="middle" font-weight="bold">Catalyst 9300 Series</text>
  <text x="100" y="112" font-family="Arial, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">48-Port Stackable Switch</text>
</svg>
