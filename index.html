<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Network Topology Mapper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Network Topology Mapper</h1>
    <div class="header-actions">
      <button id="btn-scan-real" class="btn-primary" title="Scan your real network">Scan Network</button>
      <button id="btn-discover" title="Simulate network discovery">Demo</button>
      <button id="btn-save" title="Save topology to file">Save</button>
      <button id="btn-load" title="Load topology from file">Load</button>
      <button id="btn-clear" title="Clear all devices">Clear</button>
      <button id="btn-auto-layout" title="Auto-arrange devices">Auto Layout</button>
      <input type="file" id="file-input" accept=".json" hidden>
    </div>
  </header>

  <div class="container">
    <aside class="sidebar">
      <h2>Devices</h2>
      <p class="hint">Drag a device onto the canvas</p>
      <div class="device-list">
        <div class="device-template" draggable="true" data-type="router">
          <svg viewBox="0 0 64 64" class="device-icon"><circle cx="32" cy="32" r="26" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/><circle cx="32" cy="32" r="14" stroke="#fff" stroke-width="2" fill="none"/><line x1="22" y1="32" x2="42" y2="32" stroke="#fff" stroke-width="1.5"/><line x1="32" y1="22" x2="32" y2="42" stroke="#fff" stroke-width="1.5"/><line x1="18" y1="32" x2="14" y2="32" stroke="#fff" stroke-width="2"/><line x1="46" y1="32" x2="50" y2="32" stroke="#fff" stroke-width="2"/><line x1="32" y1="18" x2="32" y2="14" stroke="#fff" stroke-width="2"/><line x1="32" y1="46" x2="32" y2="50" stroke="#fff" stroke-width="2"/></svg>
          <span>Router</span>
        </div>
        <div class="device-template" draggable="true" data-type="switch">
          <svg viewBox="0 0 64 64" class="device-icon"><rect x="6" y="18" width="52" height="28" rx="4" fill="#10b981" stroke="#047857" stroke-width="2"/><rect x="12" y="26" width="8" height="6" fill="#fff"/><rect x="24" y="26" width="8" height="6" fill="#fff"/><rect x="36" y="26" width="8" height="6" fill="#fff"/><rect x="48" y="26" width="6" height="6" fill="#fff"/><circle cx="12" cy="40" r="2" fill="#fff"/><circle cx="18" cy="40" r="2" fill="#4ade80"/></svg>
          <span>Switch</span>
        </div>
        <div class="device-template" draggable="true" data-type="accesspoint">
          <svg viewBox="0 0 64 64" class="device-icon"><circle cx="32" cy="40" r="10" fill="#f59e0b" stroke="#d97706" stroke-width="2"/><circle cx="32" cy="40" r="3" fill="#fff"/><path d="M20 30a18 18 0 0 1 24 0" stroke="#f59e0b" stroke-width="2" fill="none"/><path d="M24 34a12 12 0 0 1 16 0" stroke="#f59e0b" stroke-width="2" fill="none"/><path d="M28 38a6 6 0 0 1 8 0" stroke="#f59e0b" stroke-width="2" fill="none"/><line x1="32" y1="40" x2="32" y2="18" stroke="#d97706" stroke-width="2"/></svg>
          <span>Access Point</span>
        </div>
        <div class="device-template" draggable="true" data-type="firewall">
          <svg viewBox="0 0 64 64" class="device-icon"><rect x="10" y="8" width="44" height="48" rx="3" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/><rect x="14" y="11" width="18" height="10" fill="#fff" opacity="0.9"/><rect x="32" y="11" width="18" height="10" fill="#fff" opacity="0.9"/><rect x="14" y="23" width="18" height="10" fill="#fff" opacity="0.9"/><rect x="32" y="23" width="18" height="10" fill="#fff" opacity="0.9"/><rect x="14" y="35" width="18" height="10" fill="#fff" opacity="0.9"/><rect x="32" y="35" width="18" height="10" fill="#fff" opacity="0.9"/><circle cx="32" cy="50" r="4" fill="#b91c1c" stroke="#fff" stroke-width="1.5"/><path d="M32 48v4M30 50h4" stroke="#fff" stroke-width="1.5"/></svg>
          <span>Firewall</span>
        </div>
        <div class="device-template" draggable="true" data-type="server">
          <svg viewBox="0 0 64 64" class="device-icon"><rect x="14" y="6" width="36" height="14" rx="2" fill="#8b5cf6" stroke="#6d28d9" stroke-width="1.5"/><rect x="14" y="22" width="36" height="14" rx="2" fill="#8b5cf6" stroke="#6d28d9" stroke-width="1.5"/><rect x="14" y="38" width="36" height="14" rx="2" fill="#8b5cf6" stroke="#6d28d9" stroke-width="1.5"/><circle cx="20" cy="13" r="2" fill="#fff"/><circle cx="20" cy="29" r="2" fill="#4ade80"/><circle cx="20" cy="45" r="2" fill="#fff"/><rect x="26" y="11" width="16" height="2" fill="#fff"/><rect x="26" y="27" width="16" height="2" fill="#fff"/><rect x="26" y="43" width="16" height="2" fill="#fff"/></svg>
          <span>Server</span>
        </div>
        <div class="device-template" draggable="true" data-type="pc">
          <svg viewBox="0 0 64 64" class="device-icon"><rect x="8" y="8" width="48" height="32" rx="3" fill="#6366f1" stroke="#4338ca" stroke-width="2"/><rect x="12" y="12" width="40" height="24" fill="#1e1b4b"/><rect x="28" y="42" width="8" height="6" fill="#6366f1"/><rect x="20" y="48" width="24" height="3" rx="1" fill="#6366f1"/><line x1="18" y1="24" x2="30" y2="24" stroke="#818cf8" stroke-width="1.5"/><line x1="18" y1="28" x2="26" y2="28" stroke="#818cf8" stroke-width="1.5"/></svg>
          <span>PC</span>
        </div>
        <div class="device-template" draggable="true" data-type="cloud">
          <svg viewBox="0 0 64 64" class="device-icon"><path d="M16 38c-4 0-8-3-8-8s4-8 8-8c0.5-5 5-9 10-9 4 0 7.5 2.5 9 6 1-0.5 2-0.8 3-0.8 4 0 7 3 7 7 0 0.3 0 0.5 0 0.8 3 1 5 4 5 7 0 4-3 7-7 7H16z" fill="#06b6d4" stroke="#0891b2" stroke-width="2"/></svg>
          <span>Cloud</span>
        </div>
      </div>

      <h2>Mode</h2>
      <div class="mode-buttons">
        <button id="btn-mode-select" class="mode-btn active" title="Select & move devices">Select</button>
        <button id="btn-mode-connect" class="mode-btn" title="Draw connections between devices">Connect</button>
      </div>

      <h2>Locations</h2>
      <p class="hint">Data from scanner agents or Cat Center</p>
      <div id="locations-panel" class="locations">
        <p class="hint">No locations yet</p>
      </div>
      <button id="btn-refresh-locations" class="mode-btn" style="width:100%;margin-top:4px">Refresh</button>

      <h2>Catalyst Center</h2>
      <div class="cat-center-config">
        <label>URL
          <input type="text" id="catc-url" placeholder="https://sandboxdnac.cisco.com">
        </label>
        <label>Username
          <input type="text" id="catc-user" placeholder="admin">
        </label>
        <label>Password
          <input type="password" id="catc-pass" placeholder="password">
        </label>
        <button id="btn-catc-test" class="mode-btn" style="width:100%">Test Connection</button>
        <button id="btn-catc-scan" class="mode-btn" style="width:100%;margin-top:4px;background:#059669;border-color:#047857">Scan via Cat Center</button>
      </div>

      <h2>Properties</h2>
      <div id="properties-panel" class="properties">
        <p class="hint">Select a device to edit</p>
      </div>
    </aside>

    <main class="canvas-area">
      <div class="cidr-input hidden" id="cidr-input-container">
        <label for="cidr-input">Target Subnet (CIDR)</label>
        <input type="text" id="cidr-input" placeholder="e.g. 192.168.0.0/24 or 10.0.0.0/16">
        <select id="interface-select">
          <option value="">Auto-detect</option>
        </select>
      </div>
      <canvas id="topology-canvas"></canvas>
      <div id="tooltip" class="tooltip hidden"></div>
      <div id="scan-progress" class="scan-progress hidden">
        <div class="scan-status" id="scan-status">Scanning...</div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="scan-detail" id="scan-detail"></div>
      </div>
      <div id="device-count" class="device-count"></div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
