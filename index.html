<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Network Topology Mapper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Network Topology Mapper</h1>
    <div class="header-actions">
      <button id="btn-discover" title="Simulate network discovery">Discover Network</button>
      <button id="btn-save" title="Save topology to file">Save</button>
      <button id="btn-load" title="Load topology from file">Load</button>
      <button id="btn-clear" title="Clear all devices">Clear</button>
      <button id="btn-auto-layout" title="Auto-arrange devices">Auto Layout</button>
      <input type="file" id="file-input" accept=".json" hidden>
    </div>
  </header>

  <div class="container">
    <aside class="sidebar">
      <h2>Devices</h2>
      <p class="hint">Drag a device onto the canvas</p>
      <div class="device-list">
        <div class="device-template" draggable="true" data-type="router">
          <svg viewBox="0 0 64 64" class="device-icon"><circle cx="32" cy="32" r="28" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/><path d="M16 32h32M32 16v32M20 20l24 24M44 20l-24 24" stroke="#fff" stroke-width="2" fill="none"/><circle cx="32" cy="32" r="6" fill="#fff"/></svg>
          <span>Router</span>
        </div>
        <div class="device-template" draggable="true" data-type="switch">
          <svg viewBox="0 0 64 64" class="device-icon"><rect x="4" y="18" width="56" height="28" rx="4" fill="#10b981" stroke="#047857" stroke-width="2"/><circle cx="16" cy="32" r="3" fill="#fff"/><circle cx="28" cy="32" r="3" fill="#fff"/><circle cx="40" cy="32" r="3" fill="#fff"/><circle cx="52" cy="32" r="3" fill="#fff"/></svg>
          <span>Switch</span>
        </div>
        <div class="device-template" draggable="true" data-type="accesspoint">
          <svg viewBox="0 0 64 64" class="device-icon"><rect x="20" y="40" width="24" height="12" rx="2" fill="#f59e0b" stroke="#d97706" stroke-width="2"/><path d="M32 40V20" stroke="#d97706" stroke-width="3"/><circle cx="32" cy="16" r="4" fill="#f59e0b" stroke="#d97706" stroke-width="2"/><path d="M16 28a22 22 0 0 1 32 0" stroke="#f59e0b" stroke-width="2" fill="none"/><path d="M22 34a14 14 0 0 1 20 0" stroke="#f59e0b" stroke-width="2" fill="none"/></svg>
          <span>Access Point</span>
        </div>
        <div class="device-template" draggable="true" data-type="firewall">
          <svg viewBox="0 0 64 64" class="device-icon"><rect x="8" y="12" width="48" height="40" rx="4" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/><line x1="8" y1="24" x2="56" y2="24" stroke="#fff" stroke-width="2"/><line x1="8" y1="36" x2="56" y2="36" stroke="#fff" stroke-width="2"/><line x1="24" y1="12" x2="24" y2="52" stroke="#fff" stroke-width="2"/><line x1="40" y1="12" x2="40" y2="52" stroke="#fff" stroke-width="2"/></svg>
          <span>Firewall</span>
        </div>
        <div class="device-template" draggable="true" data-type="server">
          <svg viewBox="0 0 64 64" class="device-icon"><rect x="12" y="8" width="40" height="16" rx="3" fill="#8b5cf6" stroke="#6d28d9" stroke-width="2"/><rect x="12" y="28" width="40" height="16" rx="3" fill="#8b5cf6" stroke="#6d28d9" stroke-width="2"/><circle cx="20" cy="16" r="2" fill="#fff"/><circle cx="20" cy="36" r="2" fill="#fff"/><line x1="28" y1="16" x2="44" y2="16" stroke="#fff" stroke-width="2"/><line x1="28" y1="36" x2="44" y2="36" stroke="#fff" stroke-width="2"/></svg>
          <span>Server</span>
        </div>
        <div class="device-template" draggable="true" data-type="pc">
          <svg viewBox="0 0 64 64" class="device-icon"><rect x="8" y="8" width="48" height="36" rx="3" fill="#6366f1" stroke="#4338ca" stroke-width="2"/><rect x="12" y="12" width="40" height="28" fill="#1e1b4b"/><rect x="24" y="48" width="16" height="4" fill="#6366f1"/><rect x="18" y="52" width="28" height="3" rx="1" fill="#6366f1"/></svg>
          <span>PC</span>
        </div>
        <div class="device-template" draggable="true" data-type="cloud">
          <svg viewBox="0 0 64 64" class="device-icon"><ellipse cx="32" cy="36" rx="24" ry="14" fill="#06b6d4" stroke="#0891b2" stroke-width="2"/><ellipse cx="20" cy="30" rx="12" ry="10" fill="#06b6d4" stroke="#0891b2" stroke-width="2"/><ellipse cx="44" cy="30" rx="12" ry="10" fill="#06b6d4" stroke="#0891b2" stroke-width="2"/></svg>
          <span>Cloud</span>
        </div>
      </div>

      <h2>Mode</h2>
      <div class="mode-buttons">
        <button id="btn-mode-select" class="mode-btn active" title="Select & move devices">Select</button>
        <button id="btn-mode-connect" class="mode-btn" title="Draw connections between devices">Connect</button>
      </div>

      <h2>Properties</h2>
      <div id="properties-panel" class="properties">
        <p class="hint">Select a device to edit</p>
      </div>
    </aside>

    <main class="canvas-area">
      <canvas id="topology-canvas"></canvas>
      <div id="tooltip" class="tooltip hidden"></div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
